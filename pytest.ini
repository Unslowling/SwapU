[pytest]
testpaths = backend_estudiantil/tests tests
asyncio_mode = auto
markers =
    unit: Pruebas unitarias de logica de dominio sin base de datos ni HTTP
    integration: Pruebas de integracion que usan la API, base de datos, WebSocket o componentes combinados
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
