# Blueprint de Render para SWAPU (plan gratuito, sin Docker).
# Crea TODO automáticamente: la base PostgreSQL gratuita y la aplicación web
# (backend FastAPI + frontend servidos por el mismo proceso).
# Al desplegar, solo se piden ADMIN_EMAIL_INICIAL y ADMIN_PASSWORD_INICIAL.
databases:
  - name: swapu-db
    plan: free
    databaseName: swapu
    user: swapu

services:
  - type: web
    name: swapu
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install --upgrade pip && pip install -r backend_estudiantil/requirements-deploy.txt
    # 1) Prepara la base nueva (solo si está vacía) y el administrador inicial; 2) inicia la app
    startCommand: python scripts/inicializar_bd_nueva.py && uvicorn backend_estudiantil.infrastructure.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ENV
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: swapu-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: REDIS_URL
        value: ""
      # Sin servidor de correo configurado, la confirmación por código queda desactivada.
      # Al configurar SMTP_* en el panel de Render, cambiar a "true".
      - key: CONFIRMACION_CORREO_OBLIGATORIA
        value: "false"
      - key: BOOK_VERIFICATION_STORAGE_PATH
        value: ./storage/book-verification
      # Cuenta de administrador que se crea al primer arranque (se piden al desplegar)
      - key: ADMIN_EMAIL_INICIAL
        sync: false
      - key: ADMIN_PASSWORD_INICIAL
        sync: false
