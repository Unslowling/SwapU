[alembic]
# Configuración principal de Alembic (raíz del repositorio).
# La URL real con credenciales es inyectada dinámicamente en alembic/env.py desde settings.DATABASE_URL.
script_location = %(here)s/alembic
sqlalchemy.url = postgresql+asyncpg://localhost:5432/swapu

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers = console
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
